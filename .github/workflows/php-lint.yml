# [ashasuborna] Automated check: every PHP file must parse without syntax errors.
# Runs on every push and pull request, so a PR shows a pass/fail check before merging.
name: PHP syntax check

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          coverage: none
      - name: Check every PHP file
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || failed=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          if [ "$failed" -ne 0 ]; then echo "PHP syntax errors found"; exit 1; fi
          echo "All PHP files passed the syntax check."
